<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f19"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <!-- indigo/violet block-editor gradient — deliberately distinct from this account's
         other product banners (VueForge's green/orange, Kiln's terracotta) -->
    <linearGradient id="block1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="block2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="block3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="1040" cy="180" r="260" fill="url(#glow)"/>

  <!-- text block -->
  <text x="80" y="150" font-family="Manrope, Inter, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff">BlockCraft</text>
  <text x="82" y="196" font-family="Manrope, Inter, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#a1a1c0">The modern TipTap block editor for October CMS</text>

  <!-- accent underline -->
  <rect x="82" y="216" width="64" height="5" rx="2.5" fill="url(#block1)"/>
  <rect x="154" y="216" width="24" height="5" rx="2.5" fill="url(#block3)"/>

  <!-- feature chips -->
  <g font-family="Manrope, Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#c7c7e0">
    <rect x="82" y="250" width="94" height="34" rx="17" fill="#22222f" stroke="#33334a"/>
    <text x="100" y="272">HTML</text>
    <rect x="188" y="250" width="94" height="34" rx="17" fill="#22222f" stroke="#33334a"/>
    <text x="206" y="272">JSON</text>
    <rect x="294" y="250" width="140" height="34" rx="17" fill="#22222f" stroke="#33334a"/>
    <text x="312" y="272">Media Manager</text>
  </g>

  <!-- right side: a block-editor illustration — a document made of stacked, editable blocks -->
  <g transform="translate(760,60)">
    <rect x="0" y="0" width="420" height="260" rx="16" fill="#14141f" stroke="#2a2a3d" stroke-width="2"/>

    <!-- heading block -->
    <rect x="24" y="28" width="180" height="18" rx="4" fill="url(#block1)"/>
    <!-- paragraph blocks -->
    <rect x="24" y="60" width="372" height="10" rx="4" fill="#33334a"/>
    <rect x="24" y="78" width="330" height="10" rx="4" fill="#33334a"/>
    <rect x="24" y="96" width="350" height="10" rx="4" fill="#33334a"/>

    <!-- image block -->
    <rect x="24" y="122" width="170" height="90" rx="8" fill="url(#block2)" opacity="0.85"/>
    <circle cx="60" cy="156" r="12" fill="#ffffff" opacity="0.85"/>
    <path d="M40 200 L80 165 L110 190 L150 150 L178 205 Z" fill="#ffffff" opacity="0.25"/>

    <!-- table block -->
    <g transform="translate(210,122)">
      <rect x="0" y="0" width="186" height="90" rx="8" fill="#1e1e2c" stroke="#33334a"/>
      <line x1="0" y1="30" x2="186" y2="30" stroke="#33334a"/>
      <line x1="0" y1="60" x2="186" y2="60" stroke="#33334a"/>
      <line x1="62" y1="0" x2="62" y2="90" stroke="#33334a"/>
      <line x1="124" y1="0" x2="124" y2="90" stroke="#33334a"/>
      <rect x="8" y="9" width="46" height="12" rx="3" fill="url(#block3)"/>
    </g>

    <!-- list block with a blinking cursor -->
    <g transform="translate(24,228)">
      <circle cx="4" cy="4" r="4" fill="url(#block1)"/>
      <rect x="16" y="0" width="140" height="9" rx="4" fill="#33334a"/>
      <circle cx="4" cy="24" r="4" fill="url(#block2)"/>
      <rect x="16" y="20" width="110" height="9" rx="4" fill="#33334a"/>
      <rect x="380" y="16" width="2" height="18" fill="#a78bfa">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
