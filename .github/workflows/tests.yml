name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript:
    name: TypeScript & Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # assets/dist is committed because installs have no build step. A stale
      # or missing build would ship broken, so the committed copy must match.
      - name: Committed assets/dist matches a fresh build
        run: |
          git status --porcelain -- assets/dist
          test -z "$(git status --porcelain -- assets/dist)"

  phpunit:
    name: PHPUnit (against a real October CMS install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: oc-blockcraft-plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, mbstring, curl, dom, fileinfo
          coverage: none

      # A plugin's PHPUnit suite needs October's own base test classes
      # (PluginTestCase) and a full application skeleton to autoload real
      # Backend\Classes\FormField / FormWidgetBase against - see README.md's
      # Testing section for why.
      # October opts out of Composer's advisory block only in the newer
      # "policy" syntax, which Composer 2.9 ignores, so a plain create-project
      # aborts on enshrined/svg-sanitize. Add the 2.9-era opt-out, then install.
      # Same steps as scripts/ci-local.sh.
      - name: Install a throwaway October CMS app
        run: |
          composer create-project october/october octoberapp --no-install --no-scripts --no-interaction --prefer-dist
          php -r '$f = $argv[1]; $j = json_decode(file_get_contents($f), true); $j["config"]["audit"]["block-insecure"] = false; file_put_contents($f, json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");' octoberapp/composer.json
          composer install --working-dir=octoberapp --no-interaction --prefer-dist
          test -f octoberapp/vendor/autoload.php
          cp octoberapp/.env.example octoberapp/.env
          php octoberapp/artisan key:generate --no-interaction

      # Install from `git archive`, not the checkout: it honours .gitattributes
      # export-ignore, so this is exactly what Packagist ships to customers.
      # Only tests/ (export-ignored) is copied in separately to run them.
      - name: Install this plugin into the throwaway app, as shipped
        run: |
          mkdir -p octoberapp/plugins/amjadiqbal/blockcraft
          git -C oc-blockcraft-plugin archive HEAD | tar -x -C octoberapp/plugins/amjadiqbal/blockcraft
          test -f octoberapp/plugins/amjadiqbal/blockcraft/assets/dist/manifest.json
          cp -R oc-blockcraft-plugin/tests octoberapp/plugins/amjadiqbal/blockcraft/tests

      - name: Configure SQLite
        working-directory: octoberapp
        run: |
          mkdir -p storage
          touch storage/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i "s#^DB_DATABASE=.*#DB_DATABASE=$(pwd)/storage/database.sqlite#" .env

      - name: Run migrations
        working-directory: octoberapp
        run: php artisan october:migrate --no-interaction

      - name: Run BlockCraft's PHPUnit suite
        working-directory: octoberapp
        run: |
          cat > phpunit.blockcraft.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <phpunit bootstrap="modules/system/tests/bootstrap.php" colors="true">
              <testsuites>
                  <testsuite name="BlockCraft">
                      <directory>./plugins/amjadiqbal/blockcraft/tests</directory>
                  </testsuite>
              </testsuites>
              <php>
                  <env name="APP_ENV" value="testing" />
                  <env name="CACHE_STORE" value="array" />
                  <env name="SESSION_DRIVER" value="array" />
                  <env name="ENABLE_CSRF" value="false" />
                  <env name="DB_CONNECTION" value="sqlite" />
                  <env name="DB_DATABASE" value=":memory:" />
              </php>
          </phpunit>
          EOF
          vendor/bin/phpunit --configuration phpunit.blockcraft.xml
