0.1.0: First version of BlockCraft.
0.1.1: Fix a real bug where a BlockCraft field added inside a repeater row never initialized.
0.1.2: Ship the compiled editor assets - 0.1.0 and 0.1.1 failed on every install with "Vite manifest not found".
0.2.0: Edit tables (rows, columns, header, merge/split), edit images after inserting (alt text, width, alignment, replace, remove), and an HTML source mode. Image alignment and column widths now survive saving.
